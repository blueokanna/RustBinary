[package]
name = "rustbinary-derive"
version = "0.1.4"
edition = "2021"
rust-version = "1.87"
authors = ["blueokanna", "HyphenTeam"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["procedural-macro", "derive", "serialization", "schema", "bit-packing"]
categories = ["encoding", "data-structures", "development-tools::procedural-macro-helpers"]
description = "Derive macros for rustbinary schema metadata"
homepage = "https://github.com/blueokanna/RustBinary"
repository = "https://github.com/blueokanna/RustBinary"
documentation = "https://docs.rs/rustbinary-derive"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["derive", "parsing", "printing"] }
