[package]
name = "rustbinary-fuzz"
version = "0.0.2"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustbinary = { path = "..", features = ["derive", "compact", "cbor", "projection", "entropy", "compression"] }
nextjson = { version = "0.1.5", features = ["derive"] }

[[bin]]
name = "decode_arbitrary_bytes"
path = "fuzz_targets/decode_arbitrary_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_structured_roundtrip"
path = "fuzz_targets/decode_structured_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_compact_arbitrary"
path = "fuzz_targets/decode_compact_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_cbor_arbitrary"
path = "fuzz_targets/decode_cbor_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_frames_arbitrary"
path = "fuzz_targets/decode_frames_arbitrary.rs"
test = false
doc = false
bench = false
