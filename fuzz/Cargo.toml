[package]
name = "rustbinary-fuzz"
version = "0.0.1"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustbinary = { path = "..", features = ["derive", "compact"] }
nextjson = { version = "0.1.4", features = ["derive"] }

[[bin]]
name = "decode_arbitrary_bytes"
path = "fuzz_targets/decode_arbitrary_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_structured_roundtrip"
path = "fuzz_targets/decode_structured_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_compact_arbitrary"
path = "fuzz_targets/decode_compact_arbitrary.rs"
test = false
doc = false
bench = false
