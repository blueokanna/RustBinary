[workspace]
members = ["rustbinary-derive"]
# `fuzz` is a standalone cargo-fuzz crate; excluding it keeps `cargo metadata`
# (and therefore `cargo fmt --all`) from treating it as a stray member of this
# workspace. `rustbinary-bench` breaks out via its own empty `[workspace]`
# table.
exclude = ["fuzz"]
resolver = "2"

[package]
name = "rustbinary"
version = "0.1.7"
edition = "2021"
authors = ["blueokanna", "HyphenTeam"]
keywords = ["binary", "serialization", "rust", "networking", "middleware"]
categories = ["encoding", "data-structures", "network-programming"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/blueokanna/RustBinary"
repository = "https://github.com/blueokanna/RustBinary"
documentation = "https://docs.rs/rustbinary"
description = "A bounded nextjson binary codec with adaptive frames, zero-allocation paths, schema evolution, and authenticated pipelines"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[features]
default = ["std", "compact"]
alloc = []
std = ["alloc", "nextjson/std"]
protocol = [
    "adaptive",
    "bit-packing",
    "compact",
    "derive",
    "fingerprint",
    "reflection",
    "schema-evolution",
    "static-size",
]
# Schema-guided compact profile: no per-value tags, no field names, and
# length-prefixed containers with byte/float/string fast paths. See
# `src/compact.rs` for the wire layout. Additive: it never changes the
# self-describing profile's payloads.
compact = ["alloc"]
pipeline = ["cbor", "compression", "encryption", "parallel"]
sync = ["entropy", "reconcile", "trust"]
archive = ["std", "dep:memmap2", "dep:rkyv", "dep:blake3"]
entropy = ["alloc", "reflection"]
reconcile = ["alloc"]
trust = ["alloc", "std"]
derive = ["dep:rustbinary-derive", "nextjson/derive"]
fingerprint = ["alloc"]
reflection = []
static-size = []
cbor = ["std"]
compression = ["std", "dep:zstd"]
encryption = ["std", "dep:chacha20poly1305", "dep:getrandom", "dep:zeroize"]
bit-packing = []
adaptive = ["bit-packing"]
parallel = ["std"]
schema-evolution = ["alloc"]
bounded = ["alloc", "std", "derive"]
projection = ["std", "dep:blake3"]
simd = ["std"]

[[example]]
name = "complete"
required-features = [
    "adaptive",
    "bit-packing",
    "cbor",
    "compression",
    "derive",
    "encryption",
    "fingerprint",
    "parallel",
    "reflection",
    "schema-evolution",
    "simd",
    "static-size",
]

[[example]]
name = "compact_profile"
required-features = ["compact", "derive"]

[[example]]
name = "adaptive_zero_alloc"
required-features = ["adaptive"]

[[example]]
name = "secure_pipeline"
required-features = ["cbor", "compression", "encryption"]

[[example]]
name = "schema_evolution"
required-features = ["schema-evolution"]

[[example]]
name = "parallel_batch"
required-features = ["parallel"]

[[example]]
name = "metadata"
required-features = [
    "bit-packing",
    "derive",
    "fingerprint",
    "reflection",
    "static-size",
]

[[example]]
name = "mmap_archive"
required-features = ["archive"]

[[example]]
name = "entropy"
required-features = ["entropy", "derive"]

[[example]]
name = "merkle_archive"
required-features = ["archive"]

[[example]]
name = "delta_sync"
required-features = ["reconcile"]

[[example]]
name = "trust_session"
required-features = ["trust"]

[dependencies]
nextjson = { version = "0.1.3", default-features = false }
rustbinary-derive = { version = "0.1.4", path = "rustbinary-derive", optional = true }
zstd = { version = "0.13.3", optional = true }
chacha20poly1305 = { version = "0.11", optional = true, default-features = false, features = [
    "alloc",
] }
getrandom = { version = "0.4.3", optional = true }
zeroize = { version = "1.9.0", optional = true }
memmap2 = { version = "0.9.11", optional = true }
blake3 = { version = "1.8", optional = true, default-features = false, features = [
    "std",
] }
rkyv = { version = "0.8.18", optional = true, default-features = false, features = [
    "bytecheck",
    "little_endian",
    "pointer_width_32",
    "std",
] }

[dev-dependencies]
nextjson = { version = "0.1" }
proptest = "1.6.0"
